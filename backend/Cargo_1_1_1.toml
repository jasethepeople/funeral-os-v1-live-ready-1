
[package]
name = "funeral-os-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "rustls", "chrono", "uuid"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2"
argon2 = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1.0"
rustls = "0.22"
aws-sdk-s3 = "1.0"
validator = { version = "0.18", features = ["derive"] }
async-nats = { version = "0.34", features = ["jetstream"] }
meilisearch-sdk = "0.26"
aes-gcm = "0.10"
base64 = "0.22"
anyhow = "1.0"

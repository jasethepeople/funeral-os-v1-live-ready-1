[package]
name = "funeral-os-api"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "rustls", "chrono", "uuid", "json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2"
argon2 = "0.5"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
validator = { version = "0.18", features = ["derive"] }
async-nats = { version = "0.34", features = ["jetstream"] }
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["std"] }
rand = "0.8"
password-hash = "0.5"
blake3 = "1.5"
axum-server = { version = "0.6", features = ["tls-rustls"] }
